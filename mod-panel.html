<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Panel - Houston RP Rules</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="rules-data.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #60a5fa;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --dark-bg: #0a0e27;
            --card-bg: #1a2347;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Auth Screen */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
        }

        .auth-box {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 80px rgba(37, 99, 235, 0.4), inset 0 0 50px rgba(37, 99, 235, 0.1);
            position: relative;
            overflow: hidden;
        }

        .auth-box::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.2), transparent);
            border-radius: 50%;
        }

        .auth-content {
            position: relative;
            z-index: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-icon {
            font-size: 56px;
            color: var(--primary-light);
            margin-bottom: 15px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .auth-box h1 {
            font-size: 32px;
            color: var(--primary-light);
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .auth-box p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .auth-input-group {
            margin-bottom: 20px;
        }

        .auth-input-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .auth-input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .auth-input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }

        .auth-btn {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: 2px solid var(--primary-light);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .auth-btn:hover::before {
            left: 100%;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.4);
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid var(--danger);
            color: #fca5a5;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            animation: shake 0.5s ease-in-out;
        }

        .auth-error.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Main Panel */
        .mod-panel {
            display: none;
        }

        .mod-panel.active {
            display: block;
        }

        header {
            background: linear-gradient(135deg, #0f1729, #1a2f4a);
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--primary);
        }

        header .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #60a5fa, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: auto;
        }

        .logo-brand img {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        header .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-back, .btn-logout {
            background: rgba(96, 165, 250, 0.15);
            border: 2px solid rgba(96, 165, 250, 0.3);
            color: #60a5fa;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover, .btn-logout:hover {
            background: rgba(96, 165, 250, 0.25);
            color: #93c5fd;
            border-color: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(59, 130, 246, 0.05));
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.25);
            border-color: var(--primary-light);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            color: var(--primary-light);
            font-weight: 800;
        }

        .stat-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* Tabs */
        .section-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0;
            flex-wrap: wrap;
        }

        .section-tab {
            padding: 14px 24px;
            background: transparent;
            border: 2px solid transparent;
            border-bottom: 3px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-tab:hover {
            color: var(--primary-light);
        }

        .section-tab.active {
            color: var(--primary-light);
            border-bottom-color: var(--primary);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 16px;
            background: rgba(96, 165, 250, 0.15);
            border: 2px solid rgba(96, 165, 250, 0.3);
            color: #60a5fa;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-light);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .btn-add-rule {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 2px solid #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-add-rule:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669, #047857);
        }

        /* Rules Table */
        .rules-wrapper {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rules-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rules-table thead {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), rgba(59, 130, 246, 0.05));
            border-bottom: 2px solid var(--primary);
        }

        .rules-table th {
            padding: 18px;
            text-align: left;
            font-weight: 700;
            color: var(--primary-light);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .rules-table tbody tr {
            border-bottom: 1px solid rgba(37, 99, 235, 0.2);
            transition: all 0.3s ease;
        }

        .rules-table tbody tr:hover {
            background: rgba(37, 99, 235, 0.08);
        }

        .rules-table td {
            padding: 16px 18px;
            font-size: 14px;
        }

        .rule-title {
            font-weight: 700;
            color: var(--primary-light);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .rule-title i {
            font-size: 18px;
            color: var(--primary);
        }

        .rule-description {
            color: var(--text-secondary);
            font-size: 13px;
            max-width: 400px;
            line-height: 1.5;
        }

        .sanction-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 2px solid;
        }

        .sanction-kick {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .sanction-banned {
            background: rgba(127, 29, 29, 0.2);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.5);
        }

        .sanction-warn {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.4);
        }

        .sanction-antirol {
            background: rgba(168, 85, 247, 0.15);
            color: #d8b4fe;
            border-color: rgba(168, 85, 247, 0.4);
        }

        .rule-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit, .btn-delete {
            padding: 8px 14px;
            border: 2px solid;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.2);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 80px rgba(37, 99, 235, 0.4);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .modal-header h2 {
            color: var(--primary-light);
            font-size: 20px;
        }

        .btn-close {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 20px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .btn-close:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
            transform: translateY(-2px);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid var(--border);
        }

        .btn-cancel, .btn-save {
            padding: 12px 24px;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-cancel {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.3);
        }

        .btn-cancel:hover {
            background: rgba(96, 165, 250, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(96, 165, 250, 0.2);
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: #10b981;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .success-message {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
            border: 2px solid rgba(16, 185, 129, 0.4);
            color: #86efac;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .success-message.show {
            display: flex;
        }

        .success-message i {
            font-size: 18px;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-15px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            header .header-content {
                flex-direction: column;
                gap: 10px;
            }

            header h1 {
                font-size: 20px;
            }

            .toolbar {
                flex-direction: column;
            }

            .btn-add-rule {
                margin-left: 0;
                width: 100%;
            }

            .rules-table {
                font-size: 12px;
            }

            .rules-table th, .rules-table td {
                padding: 10px;
            }

            .rule-actions {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <div class="auth-content">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h1>Mod Panel</h1>
                    <p>Ingresa el código de acceso para administrar las reglas del servidor</p>
                </div>
                <div class="auth-error" id="authError"></div>
                <div class="auth-input-group">
                    <label for="codeInput">Código de Acceso</label>
                    <input type="password" id="codeInput" placeholder="••••••••" autocomplete="off">
                </div>
                <button class="auth-btn" onclick="checkAuth()">
                    <i class="fas fa-arrow-right"></i> Ingresar
                </button>
                <button class="auth-btn" style="background: linear-gradient(135deg, #6366f1, #4f46e5); border-color: #6366f1; margin-top: 8px;" onclick="goBackToRules()">
                    <i class="fas fa-arrow-left"></i> Volver a Reglas
                </button>
            </div>
        </div>
    </div>

    <!-- Mod Panel -->
    <div class="mod-panel" id="modPanel">
         <header>
            <div class="header-content">
                <div class="logo-brand">
                    <img src="images/logo.png" alt="HCRP Logo">
                    <h1>
                        <i class="fas fa-cogs"></i> Mod Panel
                    </h1>
                </div>
                <div class="header-actions">
                    <button class="btn-back" onclick="goBackToRules()">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Salir
                    </button>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-label">Total de Reglas</div>
                    <div class="stat-value" id="totalRules">0</div>
                    <div class="stat-subtitle">Todas las reglas cargadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Roleplay</div>
                    <div class="stat-value" id="rolesRules">0</div>
                    <div class="stat-subtitle">Reglas de Roleplay</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Discord</div>
                    <div class="stat-value" id="discordRules">0</div>
                    <div class="stat-subtitle">Reglas de Discord</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Sanciones</div>
                    <div class="stat-value" id="sanctionTypes">4</div>
                    <div class="stat-subtitle">Tipos de sanción</div>
                </div>
            </div>

            <!-- Section Tabs -->
            <div class="section-tabs">
                <button class="section-tab active" onclick="switchSection('roleplay')">
                    <i class="fas fa-theater-masks"></i> Reglas de Roleplay
                </button>
                <button class="section-tab" onclick="switchSection('discord')">
                    <i class="fab fa-discord"></i> Reglas de Discord
                </button>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="filter-group">
                    <button class="filter-btn active" onclick="filterRules('ALL')">
                        <i class="fas fa-list"></i> Todas
                    </button>
                    <button class="filter-btn" onclick="filterRules('KICK')">
                        <i class="fas fa-ban"></i> KICK
                    </button>
                    <button class="filter-btn" onclick="filterRules('BANNED')">
                        <i class="fas fa-lock"></i> BANNED
                    </button>
                    <button class="filter-btn" onclick="filterRules('WARN')">
                        <i class="fas fa-exclamation-triangle"></i> WARN
                    </button>
                </div>
                <button class="btn-add-rule" onclick="openAddRuleModal()">
                    <i class="fas fa-plus-circle"></i> Agregar Regla
                </button>
            </div>

            <!-- Rules Table -->
            <div class="rules-wrapper">
                <table class="rules-table">
                    <thead>
                        <tr>
                            <th style="width: 120px;">Título</th>
                            <th>Descripción</th>
                            <th style="width: 110px;">Sanción</th>
                            <th style="width: 140px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="rulesTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 40px;">
                                <div class="empty-state">
                                    <div class="empty-state-icon"><i class="fas fa-spinner fa-spin"></i></div>
                                    <p>Cargando reglas...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit/Add Rule Modal -->
    <div class="modal" id="ruleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Agregar Regla</h2>
                <button class="btn-close" onclick="closeRuleModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="ruleForm">
                <div class="form-group">
                    <label for="ruleTitle">Título de la Regla *</label>
                    <input type="text" id="ruleTitle" placeholder="Ej: RDM" required>
                </div>

                <div class="form-group">
                    <label for="ruleCode">Código (Ej: Random Death Match)</label>
                    <input type="text" id="ruleCode" placeholder="Ej: Random Death Match">
                </div>

                <div class="form-group">
                    <label for="ruleDescription">Descripción de la Regla *</label>
                    <textarea id="ruleDescription" placeholder="Describe detalladamente qué es esta regla..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="ruleSanction">Sanción *</label>
                    <select id="ruleSanction" required>
                        <option value="">Seleccionar...</option>
                        <option value="KICK">KICK</option>
                        <option value="BANNED">BANNED</option>
                        <option value="WARN">WARN</option>
                        <option value="ANTIROL">ANTIROL</option>
                        <option value="1 PUNTO">1 PUNTO</option>
                        <option value="2 PUNTOS">2 PUNTOS</option>
                        <option value="3 PUNTOS">3 PUNTOS</option>
                        <option value="4 PUNTOS">4 PUNTOS</option>
                        <option value="5 PUNTOS">5 PUNTOS (BAN)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ruleSection">Sección *</label>
                    <select id="ruleSection" required>
                        <option value="">Seleccionar...</option>
                        <option value="roleplay">Roleplay</option>
                        <option value="discord">Discord</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeRuleModal()">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const CORRECT_CODE = "AI2026";
        let isAuthenticated = false;
        let rulesData = [];
        let currentFilter = "ALL";
        let currentSection = "roleplay";
        let editingRuleIndex = -1;

        // Cargar reglas desde localStorage
        function loadRules() {
            // Usar las funciones compartidas de rules-data.js
            rulesData = loadRulesShared();
            updateStats();
        }

        function saveRules() {
            // Usar la función compartida de rules-data.js
            saveRulesShared(rulesData);
        }

        function updateStats() {
            const roleplay = rulesData.filter(r => r.section === 'roleplay').length;
            const discord = rulesData.filter(r => r.section === 'discord').length;
            document.getElementById('totalRules').textContent = rulesData.length;
            document.getElementById('rolesRules').textContent = roleplay;
            document.getElementById('discordRules').textContent = discord;
        }

        function checkAuth() {
            const code = document.getElementById('codeInput').value;
            if (code === CORRECT_CODE) {
                isAuthenticated = true;
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('modPanel').classList.add('active');
                loadRules();
                renderRules();
            } else {
                showAuthError("Código incorrecto");
                document.getElementById('codeInput').value = '';
                document.getElementById('codeInput').focus();
            }
        }

        function showAuthError(msg) {
            const errorEl = document.getElementById('authError');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 3000);
        }

        function showSuccess(msg) {
            const successEl = document.getElementById('successMessage');
            document.getElementById('successText').textContent = msg;
            successEl.classList.add('show');
            setTimeout(() => successEl.classList.remove('show'), 3000);
        }

        function switchSection(section) {
            currentSection = section;
            currentFilter = "ALL";
            document.querySelectorAll('.section-tab').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.section-tab').classList.add('active');
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.filter-btn')[0].classList.add('active');
            renderRules();
        }

        function renderRules() {
            let filtered = rulesData.filter(r => r.section === currentSection);
            if (currentFilter !== 'ALL') {
                filtered = filtered.filter(r => r.sanction.includes(currentFilter));
            }

            if (filtered.length === 0) {
                document.getElementById('rulesTableBody').innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px;">
                            <div class="empty-state">
                                <div class="empty-state-icon"><i class="fas fa-inbox"></i></div>
                                <p>No hay reglas con este filtro</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            document.getElementById('rulesTableBody').innerHTML = filtered.map((rule, idx) => {
                const realIdx = rulesData.indexOf(rule);
                const icon = getIconForRule(rule.title);
                return `
                    <tr>
                        <td class="rule-title"><i class="${icon}"></i> ${rule.title}</td>
                        <td class="rule-description">${rule.description}</td>
                        <td>
                            <span class="sanction-badge sanction-${rule.sanction.toLowerCase().replace(/\s/g, '-')}">${rule.sanction}</span>
                        </td>
                        <td>
                            <div class="rule-actions">
                                <button class="btn-edit" onclick="openEditRuleModal(${realIdx})">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn-delete" onclick="deleteRule(${realIdx})">
                                    <i class="fas fa-trash"></i> Eliminar
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterRules(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.filter-btn').classList.add('active');
            renderRules();
        }

        function openAddRuleModal() {
            editingRuleIndex = -1;
            document.getElementById('modalTitle').textContent = 'Agregar Nueva Regla';
            document.getElementById('ruleForm').reset();
            document.getElementById('ruleSection').value = currentSection;
            document.getElementById('ruleModal').classList.add('active');
        }

        function openEditRuleModal(idx) {
            editingRuleIndex = idx;
            const rule = rulesData[idx];
            document.getElementById('modalTitle').textContent = 'Editar Regla';
            document.getElementById('ruleTitle').value = rule.title;
            document.getElementById('ruleCode').value = rule.code || '';
            document.getElementById('ruleDescription').value = rule.description;
            document.getElementById('ruleSanction').value = rule.sanction;
            document.getElementById('ruleSection').value = rule.section;
            document.getElementById('ruleModal').classList.add('active');
        }

        function closeRuleModal() {
            document.getElementById('ruleModal').classList.remove('active');
            editingRuleIndex = -1;
        }

        document.getElementById('ruleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const rule = {
                title: document.getElementById('ruleTitle').value.trim().toUpperCase(),
                code: document.getElementById('ruleCode').value.trim(),
                description: document.getElementById('ruleDescription').value.trim(),
                sanction: document.getElementById('ruleSanction').value,
                section: document.getElementById('ruleSection').value
            };

            if (!rule.title || !rule.description || !rule.sanction || !rule.section) {
                alert('Por favor completa todos los campos requeridos');
                return;
            }

            if (editingRuleIndex >= 0) {
                rulesData[editingRuleIndex] = rule;
                showSuccess('✅ Regla actualizada correctamente');
            } else {
                rulesData.push(rule);
                showSuccess('✅ Regla agregada correctamente');
            }

            saveRules();
            updateStats();
            closeRuleModal();
            renderRules();
        });

        function deleteRule(idx) {
            if (confirm('¿Estás seguro de que deseas eliminar esta regla?')) {
                rulesData.splice(idx, 1);
                saveRules();
                updateStats();
                showSuccess('✅ Regla eliminada correctamente');
                renderRules();
            }
        }

        function logout() {
            if (confirm('¿Deseas cerrar sesión?')) {
                isAuthenticated = false;
                document.getElementById('modPanel').classList.remove('active');
                document.getElementById('authContainer').style.display = 'flex';
                document.getElementById('codeInput').value = '';
                document.getElementById('codeInput').focus();
            }
        }

        function goBackToRules() {
            window.location.href = 'rules.html';
        }

        // Event listeners
        document.getElementById('codeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkAuth();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeRuleModal();
        });

        window.addEventListener('load', function() {
            document.getElementById('codeInput').focus();
        });

        // Listener para sincronización con otros tabs
        window.addEventListener('rulesUpdated', function(e) {
            if (isAuthenticated) {
                rulesData = e.detail.rules;
                updateStats();
                renderRules();
            }
        });
    </script>
</body>
</html>
