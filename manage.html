<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Shift - HOUSTON RP</title>
  <link rel="icon" href="favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1424;
      color: #e8ecf4;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 30px;
    }
    .header h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
    }
    .dept-section {
      margin-bottom: 50px;
    }
    .dept-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #3b82f6;
      color: #3b82f6;
    }
    .officer-card {
      background: #17223a;
      border: 1px solid #263552;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .officer-info {
      flex: 1;
      min-width: 300px;
    }
    .officer-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #e8ecf4;
      margin-bottom: 10px;
    }
    .officer-details {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #94a3b8;
      flex-wrap: wrap;
    }
    .officer-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 300px;
      justify-content: flex-end;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-success {
      background: #4acf8f;
      color: #0d1424;
    }
    .btn-success:hover {
      background: #2fa76f;
    }
    .btn-warning {
      background: #e6a868;
      color: #0d1424;
    }
    .btn-warning:hover {
      background: #d4974f;
    }
    .btn-danger {
      background: #e54850;
      color: white;
    }
    .btn-danger:hover {
      background: #c73c44;
    }
    .btn-info {
      background: #06b6d4;
      color: white;
    }
    .btn-info:hover {
      background: #0891b2;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #131d2f;
      border: 1px solid #263552;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
    }
    .modal-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background: #0d1424;
      border: 1px solid #263552;
      border-radius: 6px;
      color: #e8ecf4;
      font-family: 'Inter', sans-serif;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,111,182,0.1);
    }
    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 40px;
      font-size: 14px;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap">
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📋 Manage Shifts - HOUSTON RP</h1>
    <p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">Sistema de Gestión de Turnos y Horas</p>
  </div>

  <div id="content">
    <div class="loading">Cargando oficiales...</div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">Modal</div>
    <div id="modal-body"></div>
    <div class="modal-buttons">
      <button class="btn btn-primary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmAction()">Confirmar</button>
    </div>
  </div>
</div>

<script src="assets/auth.js"></script>

    ],
    THP: [
      { rank: 'Trooper en Prácticas', salary: 24 },
      { rank: 'Trooper I', salary: 25 },
      { rank: 'Trooper Senior', salary: 27 },
      { rank: 'Master Trooper', salary: 29 },
      { rank: 'Trooper First Class', salary: 31 },
      { rank: 'Corporal', salary: 33 },
      { rank: 'Senior Corporal', salary: 35 },
      { rank: 'Sargento', salary: 38 },
      { rank: 'Staff Sergeant', salary: 41 },
      { rank: 'Master Sergeant', salary: 44 },
      { rank: 'Trooper Major', salary: 47 },
      { rank: 'Teniente', salary: 50 },
      { rank: 'Capitán', salary: 53 },
      { rank: 'Coronel', salary: 56 },
      { rank: 'Teniente Coronel', salary: 58 },
      { rank: 'Jefe de Troopers', salary: 60 }
    ]
  };

  let allOfficers = [];
  let currentAction = null;

  async function loadOfficers() {
    try {
      document.getElementById('content').innerHTML = '<div class="loading">Verificando sesión...</div>';
      
      // Verificar que el usuario tiene permisos
      const session = hrpGetSession();
      if (!session) {
        document.getElementById('content').innerHTML = '<div class="loading" style="color: #e54850;">❌ No estás autenticado. Por favor, <a href="index.html" style="color: #3b82f6;">inicia sesión</a>.</div>';
        return;
      }

      document.getElementById('content').innerHTML = '<div class="loading">Verificando permisos...</div>';

      // Verificar permisos de administrador
      const hasAccess = await hrpCheckManageAccess(session.id);
      if (!hasAccess) {
        document.getElementById('content').innerHTML = '<div class="loading" style="color: #e54850;">❌ No tienes permisos para acceder a esta página. Contacta al administrador.</div>';
        return;
      }

      document.getElementById('content').innerHTML = '<div class="loading">Cargando oficiales...</div>';

      // Cargar datos de police_members con horas - SIMPLIFICADO
      const members = await supaSelect('police_members', 'discord_id, username, department, rank', { limit: '1000' });
      
      if (!members || members.length === 0) {
        document.getElementById('content').innerHTML = '<div class="loading">No hay oficiales registrados</div>';
        return;
      }

      // Cargar TODAS las horas en una sola query más eficiente
      const [allShifts, allAdjustments] = await Promise.all([
        supaSelect('police_shift_sessions', 'discord_id, total_seconds', { status: 'eq.completed', limit: '10000' }).catch(() => []),
        supaSelect('police_hours_adjustments', 'discord_id, adjustment_seconds', { limit: '10000' }).catch(() => [])
      ]);

      // Crear mapas de horas por discord_id
      const hoursMap = {};
      
      if (allShifts && allShifts.length > 0) {
        for (const shift of allShifts) {
          if (!hoursMap[shift.discord_id]) hoursMap[shift.discord_id] = 0;
          hoursMap[shift.discord_id] += shift.total_seconds || 0;
        }
      }
      
      if (allAdjustments && allAdjustments.length > 0) {
        for (const adj of allAdjustments) {
          if (!hoursMap[adj.discord_id]) hoursMap[adj.discord_id] = 0;
          hoursMap[adj.discord_id] += adj.adjustment_seconds || 0;
        }
      }

      // Procesar oficiales sin hacer queries individuales
      allOfficers = members.map(member => ({
        discord_id: member.discord_id,
        username: member.username,
        character_name: member.username, // Sin query a characters
        department: member.department || 'Sin Asignar',
        rank: member.rank || 'Sin Rango',
        hours: Math.round((hoursMap[member.discord_id] || 0) / 3600)
      }));
      
      if (allOfficers.length === 0) {
        document.getElementById('content').innerHTML = '<div class="loading">No hay oficiales registrados</div>';
        return;
      }
      
      renderOfficersByDepartment();
    } catch (e) {
      console.error('Error cargando oficiales:', e);
      document.getElementById('content').innerHTML = `<div class="loading" style="color: #e54850;">❌ Error: ${e.message || 'Error desconocido'}</div>`;
    }
  }

  function renderOfficersByDepartment() {
    const depts = ['HPD', 'HCSO', 'HFD', 'EMS', 'DOT', 'ICE', 'THP'];
    let html = '';

    for (const dept of depts) {
      const officersInDept = allOfficers.filter(o => o.department === dept);
      if (officersInDept.length === 0) continue;

      html += `<div class="dept-section">
        <div class="dept-title">${dept} - ${officersInDept.length} oficiales</div>`;

      for (const officer of officersInDept) {
        html += `
          <div class="officer-card">
            <div class="officer-info">
              <div class="officer-name">${officer.character_name}</div>
              <div class="officer-details">
                <span>🏢 ${officer.department}</span>
                <span>🎖️ ${officer.rank}</span>
                <span>⏰ ${officer.hours} horas</span>
              </div>
            </div>
            <div class="officer-actions">
              <button class="btn btn-success" onclick="openAddHoursModal('${officer.username}', ${officer.hours}, '${officer.character_name}')">➕ Agregar</button>
              <button class="btn btn-warning" onclick="openRemoveHoursModal('${officer.username}', ${officer.hours}, '${officer.character_name}')">➖ Remover</button>
              <button class="btn btn-info" onclick="resetHours('${officer.username}', '${officer.character_name}')">🔄 Reiniciar</button>
              <button class="btn btn-danger" onclick="fireOfficer('${officer.username}', '${officer.character_name}')">🚨 Despedir</button>
            </div>
          </div>
        `;
      }

      html += `</div>`;
    }

    document.getElementById('content').innerHTML = html;
  }

  function openModal(title, content) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = content;
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  function confirmAction() {
    if (currentAction) currentAction();
  }

  function openAddHoursModal(username, currentHours, name) {
    openModal(`Agregar Horas - ${name}`, `
      <input type="number" id="hours-input" placeholder="Cantidad de horas" min="1" value="1">
    `);
    currentAction = () => {
      const hours = parseInt(document.getElementById('hours-input').value) || 0;
      updateOfficerHours(username, currentHours + hours, name);
      closeModal();
    };
  }

  function openRemoveHoursModal(username, currentHours, name) {
    openModal(`Remover Horas - ${name}`, `
      <input type="number" id="hours-input" placeholder="Cantidad de horas" min="1" max="${currentHours}" value="1">
    `);
    currentAction = () => {
      const hours = parseInt(document.getElementById('hours-input').value) || 0;
      updateOfficerHours(username, Math.max(0, currentHours - hours), name);
      closeModal();
    };
  }

  function resetHours(username, name) {
    if (confirm(`¿Reiniciar horas de ${name}?`)) {
      updateOfficerHours(username, 0, name);
    }
  }

  async function updateOfficerHours(username, newHours, name) {
    try {
      // Obtener el discord_id del oficial
      const officers = await supaSelect('police_members', 'discord_id', { username: `eq.${username}` });
      if (!officers || officers.length === 0) {
        alert(`❌ No se encontró el oficial ${name}`);
        return;
      }
      
      const discordId = officers[0].discord_id;
      const session = hrpGetSession();
      const newSeconds = newHours * 3600;
      
      // Calcular la diferencia de horas actual
      const shifts = await supaSelect('police_shift_sessions', 'total_seconds', {
        discord_id: `eq.${discordId}`,
        status: 'eq.completed'
      });
      
      let currentSeconds = 0;
      if (shifts && shifts.length > 0) {
        currentSeconds = shifts.reduce((sum, s) => sum + (s.total_seconds || 0), 0);
      }
      
      const adjustment = newSeconds - currentSeconds;
      
      if (adjustment !== 0) {
        if (adjustment > 0) {
          await hrpAddHours(discordId, username, adjustment, `Ajuste manual por ${session?.username || 'Admin'}`, session?.id);
        } else {
          await hrpRemoveHours(discordId, username, Math.abs(adjustment), `Ajuste manual por ${session?.username || 'Admin'}`, session?.id);
        }
      }
      
      alert(`✓ Horas actualizadas para ${name}: ${newHours}h`);
      loadOfficers();
    } catch (e) {
      console.error('Error actualizando horas:', e);
      alert(`❌ Error: ${e.message}`);
      loadOfficers();
    }
  }

  async function fireOfficer(username, name) {
    if (!confirm(`¿Despeedir a ${name}? (Se quitarán todas las horas y el rango)`)) {
      return;
    }
    
    try {
      const session = hrpGetSession();
      const officers = await supaSelect('police_members', 'discord_id', { username: `eq.${username}` });
      if (!officers || officers.length === 0) {
        alert(`❌ No se encontró el oficial ${name}`);
        return;
      }
      
      const discordId = officers[0].discord_id;
      
      // Obtener las horas actuales
      const shifts = await supaSelect('police_shift_sessions', 'total_seconds', {
        discord_id: `eq.${discordId}`,
        status: 'eq.completed'
      });
      
      let currentSeconds = 0;
      if (shifts && shifts.length > 0) {
        currentSeconds = shifts.reduce((sum, s) => sum + (s.total_seconds || 0), 0);
      }
      
      // Remover todas las horas
      if (currentSeconds > 0) {
        await hrpRemoveHours(discordId, username, currentSeconds, `Despido de ${name} por ${session?.username || 'Admin'}`, session?.id);
      }
      
      alert(`✓ ${name} ha sido despedido`);
      loadOfficers();
    } catch (e) {
      console.error('Error despidiendo oficial:', e);
      alert(`❌ Error: ${e.message}`);
      loadOfficers();
    }
  }

  window.addEventListener('load', loadOfficers);
</script>
