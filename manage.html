<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Shift - HOUSTON RP</title>
  <link rel="icon" href="favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1424;
      color: #e8ecf4;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 30px;
    }
    .header h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid #263552;
      padding-bottom: 0;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 12px 20px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }
    .tab-btn.active {
      color: #e8ecf4;
      border-bottom-color: #3b82f6;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .officer-card {
      background: #17223a;
      border: 1px solid #263552;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .officer-info {
      flex: 1;
      min-width: 300px;
    }
    .officer-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #e8ecf4;
      margin-bottom: 10px;
    }
    .officer-details {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #94a3b8;
      flex-wrap: wrap;
    }
    .officer-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 300px;
      justify-content: flex-end;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-success {
      background: #4acf8f;
      color: #0d1424;
    }
    .btn-success:hover {
      background: #2fa76f;
    }
    .btn-danger {
      background: #e54850;
      color: white;
    }
    .btn-danger:hover {
      background: #c73c44;
    }
    .btn-warning {
      background: #e6a868;
      color: #0d1424;
    }
    .btn-warning:hover {
      background: #d4974f;
    }
    .btn-info {
      background: #06b6d4;
      color: white;
    }
    .btn-info:hover {
      background: #0891b2;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    input, select {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      background: #0d1424;
      border: 1px solid #263552;
      border-radius: 6px;
      color: #e8ecf4;
      font-family: 'Inter', sans-serif;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,111,182,0.1);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #131d2f;
      border: 1px solid #263552;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
    }
    .modal-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(59,111,182,0.2);
      color: #3b82f6;
    }
    .salary-info {
      background: rgba(59,111,182,0.1);
      border: 1px solid rgba(59,111,182,0.3);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap">
</head>
<body>

<div class="container">

  <div class="header">
    <h1>📋 Manage Shifts - HOUSTON RP</h1>
    <p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">Sistema de Gestión de Turnos y Pagos</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('horas')">⏰ Horas</button>
    <button class="tab-btn" onclick="switchTab('pagar')">💰 Pagar Oficiales</button>
    <button class="tab-btn" onclick="switchTab('rango')">🎖️ Cambiar Rango</button>
    <button class="tab-btn" onclick="switchTab('departamento')">🏢 Cambiar Departamento</button>
    <button class="tab-btn" onclick="switchTab('k9')">🐕 K-9 Applications</button>
    <button class="tab-btn" onclick="switchTab('reports')">📊 Reportes</button>
  </div>

  <!-- TAB: HORAS -->
  <div id="horas" class="tab-content active">
    <div style="background: #131d2f; border: 1px solid #263552; border-radius: 12px; padding: 20px;">
      <h2 style="margin-bottom: 20px;">⏰ Gestionar Horas de Oficiales</h2>
      <div class="input-group">
        <input type="text" id="search-horas" placeholder="Buscar oficial por nombre..." onkeyup="filterOfficers('horas')">
        <select id="dept-filter-horas" onchange="filterOfficers('horas')" style="flex: 0 0 150px;">
          <option value="">Todos Departamentos</option>
          <option value="HPD">HPD</option>
          <option value="HCSO">HCSO</option>
          <option value="HFD">HFD</option>
          <option value="EMS">EMS</option>
          <option value="DOT">DOT</option>
          <option value="ICE">ICE</option>
          <option value="THP">THP</option>
        </select>
      </div>
      <div id="horas-list"></div>
    </div>
  </div>

  <!-- TAB: PAGAR -->
  <div id="pagar" class="tab-content">
    <div style="background: #131d2f; border: 1px solid #263552; border-radius: 12px; padding: 20px;">
      <h2 style="margin-bottom: 20px;">💰 Sistema de Pagos</h2>
      <div class="input-group">
        <input type="text" id="search-pagar" placeholder="Buscar oficial...">
        <select id="dept-filter-pagar" onchange="filterOfficers('pagar')" style="flex: 0 0 150px;">
          <option value="">Todos Departamentos</option>
          <option value="HPD">HPD</option>
          <option value="HCSO">HCSO</option>
          <option value="HFD">HFD</option>
          <option value="EMS">EMS</option>
          <option value="DOT">DOT</option>
          <option value="ICE">ICE</option>
          <option value="THP">THP</option>
        </select>
      </div>
      <div id="pagar-list"></div>
    </div>
  </div>

  <!-- TAB: RANGO -->
  <div id="rango" class="tab-content">
    <div style="background: #131d2f; border: 1px solid #263552; border-radius: 12px; padding: 20px;">
      <h2 style="margin-bottom: 20px;">🎖️ Cambiar Rango</h2>
      <div class="input-group">
        <input type="text" id="search-rango" placeholder="Buscar oficial...">
        <select id="dept-filter-rango" onchange="loadRanksForDept()" style="flex: 0 0 150px;">
          <option value="">Selecciona Departamento</option>
          <option value="HPD">HPD</option>
          <option value="HCSO">HCSO</option>
          <option value="HFD">HFD</option>
          <option value="EMS">EMS</option>
          <option value="DOT">DOT</option>
          <option value="ICE">ICE</option>
          <option value="THP">THP</option>
        </select>
      </div>
      <div id="rango-list"></div>
    </div>
  </div>

  <!-- TAB: DEPARTAMENTO -->
  <div id="departamento" class="tab-content">
    <div style="background: #131d2f; border: 1px solid #263552; border-radius: 12px; padding: 20px;">
      <h2 style="margin-bottom: 20px;">🏢 Cambiar Departamento</h2>
      <div class="input-group">
        <input type="text" id="search-dept" placeholder="Buscar oficial...">
      </div>
      <div id="departamento-list"></div>
    </div>
  </div>

  <!-- TAB: K9 -->
  <div id="k9" class="tab-content">
    <div style="background: #131d2f; border: 1px solid #263552; border-radius: 12px; padding: 20px;">
      <h2 style="margin-bottom: 20px;">🐕 Aplicaciones K-9</h2>
      <div id="k9-list" style="text-align: center; color: #94a3b8; padding: 40px;">
        Cargando aplicaciones K-9...
      </div>
    </div>
  </div>

  <!-- TAB: REPORTS -->
  <div id="reports" class="tab-content">
    <div style="background: #131d2f; border: 1px solid #263552; border-radius: 12px; padding: 20px;">
      <h2 style="margin-bottom: 20px;">📊 Reportes y Solicitudes</h2>
      <div id="reports-list" style="text-align: center; color: #94a3b8; padding: 40px;">
        Cargando reportes...
      </div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">Modal</div>
    <div id="modal-body"></div>
    <div class="modal-buttons">
      <button class="btn btn-primary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmAction()">Confirmar</button>
    </div>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
  // SISTEMA DE RANGOS Y SALARIOS
  const rankSystem = {
    HPD: [
      { rank: 'Oficial de Policía I', salary: 24 },

    ],
    HCSO: [

      { rank: 'Deputy III', salary: 30 },
      { rank: 'Corporal', salary: 33 },
      { rank: 'Sargento', salary: 36 },

    ],
    HFD: [
      { rank: 'Bombero Recluta', salary: 24 },
      { rank: 'Bombero', salary: 26 },
      { rank: 'Bombero II', salary: 28 },
      { rank: 'Cabo', salary: 31 },
      { rank: 'Sargento', salary: 34 },
      { rank: 'Teniente', salary: 37 },
      { rank: 'Capitán', salary: 40 },
      { rank: 'Jefe de División', salary: 44 },
      { rank: 'Subjefe', salary: 48 },
      { rank: 'Jefe Asistente', salary: 51 },
      { rank: 'Jefe de Batallón', salary: 54 },
      { rank: 'Jefe de Departamento', salary: 57 },
      { rank: 'Comisionado', salary: 60 }
    ],
    EMS: [
      { rank: 'EMT en Prácticas', salary: 24 },
      { rank: 'EMT Básico', salary: 26 },
      { rank: 'EMT', salary: 29 },
      { rank: 'EMT Avanzado', salary: 32 },
      { rank: 'Paramédico', salary: 35 },
      { rank: 'Paramédico Senior', salary: 38 },
      { rank: 'Supervisor', salary: 41 },
      { rank: 'Supervisor de Turno', salary: 44 },
      { rank: 'Supervisor de División', salary: 47 },
      { rank: 'Teniente EMS', salary: 50 },
      { rank: 'Capitán EMS', salary: 53 },

    ],
    DOT: [
      { rank: 'Aprendiz', salary: 24 },
      { rank: 'Trabajador', salary: 26 },
      { rank: 'Operador de Equipo', salary: 28 },
      { rank: 'Técnico de Carreteras', salary: 31 },
      { rank: 'Operador Senior', salary: 34 },
      { rank: 'Líder de Cuadrilla', salary: 37 },
      { rank: 'Supervisor de Sitio', salary: 40 },
      { rank: 'Coordinador de Proyectos', salary: 43 },
      { rank: 'Gerente Asistente', salary: 46 },
      { rank: 'Gerente de Operaciones', salary: 50 },
      { rank: 'Director Adjunto', salary: 54 },
      { rank: 'Director de DOT', salary: 57 },
      { rank: 'Director Ejecutivo', salary: 60 }
    ],
    ICE: [
      { rank: 'Cadete ICE', salary: 24 },
      { rank: 'Agente I', salary: 27 },
      { rank: 'Agente II', salary: 30 },
      { rank: 'Agente Especial', salary: 33 },
      { rank: 'Agente Especial Senior', salary: 36 },
      { rank: 'Agente Supervisor', salary: 39 },
      { rank: 'Agente Supervisor Senior', salary: 42 },
      { rank: 'Subdirector de Agencia', salary: 46 },
      { rank: 'Director de Agencia', salary: 50 },
      { rank: 'Subdirector General', salary: 54 },
      { rank: 'Director de ICE', salary: 58 }
    ],
    THP: [
      { rank: 'Trooper en Prácticas', salary: 24 },
      { rank: 'Trooper I', salary: 25 },
      { rank: 'Trooper Senior', salary: 27 },
      { rank: 'Master Trooper', salary: 29 },
      { rank: 'Trooper First Class', salary: 31 },
      { rank: 'Corporal', salary: 33 },
      { rank: 'Senior Corporal', salary: 35 },
      { rank: 'Sargento', salary: 38 },
      { rank: 'Staff Sergeant', salary: 41 },
      { rank: 'Master Sergeant', salary: 44 },
      { rank: 'Trooper Major', salary: 47 },
      { rank: 'Teniente', salary: 50 },
      { rank: 'Capitán', salary: 53 },
      { rank: 'Coronel', salary: 56 },
      { rank: 'Teniente Coronel', salary: 58 },
      { rank: 'Jefe de Troopers', salary: 60 }
    ]
  };

  let allOfficers = [];
  let currentAction = null;

  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
    
    if (tab === 'horas') renderHorasTab();
    if (tab === 'pagar') renderPagarTab();
    if (tab === 'rango') renderRangoTab();
    if (tab === 'departamento') renderDepartamentoTab();
  }

  async function loadOfficers() {
    try {
      if (typeof supaSelect === 'function') {
        allOfficers = await supaSelect('police_members', '*', { limit: '1000' });
        console.log('✓ Oficiales cargados:', allOfficers.length);
      }
    } catch (e) {
      console.error('Error cargando:', e);
    }
    
    if (!allOfficers || allOfficers.length === 0) {
      allOfficers = getDemoOfficers();
    }
    
    renderHorasTab();
  }

  function getDemoOfficers() {
    return [
      { id: 1, username: 'Juan Méndez', character_name: 'Juan Méndez', department: 'HPD', rank: 'Oficial Senior I', hours: 125 },
      { id: 2, username: 'María Cortés', character_name: 'María Cortés', department: 'HCSO', rank: 'Deputy Sheriff', hours: 98 },
      { id: 3, username: 'Carlos Rojas', character_name: 'Carlos Rojas', department: 'HPD', rank: 'Detective', hours: 156 },
      { id: 4, username: 'Ana Pérez', character_name: 'Ana Pérez', department: 'EMS', rank: 'EMT', hours: 87 },
      { id: 5, username: 'Luis García', character_name: 'Luis García', department: 'HFD', rank: 'Bombero', hours: 110 }
    ];
  }

  function calculateSalary(hours, rank, dept) {
    const ranks = rankSystem[dept] || [];
    const rankData = ranks.find(r => r.rank === rank);
    if (!rankData) return 0;
    return Math.round(hours * 6 * rankData.salary);
  }

  function renderHorasTab() {
    const list = document.getElementById('horas-list');
    list.innerHTML = allOfficers.map(officer => `
      <div class="officer-card">
        <div class="officer-info">
          <div class="officer-name">${officer.character_name || officer.username}</div>
          <div class="officer-details">
            <span>🏢 ${officer.department}</span>
            <span>🎖️ ${officer.rank}</span>
            <span>⏰ ${officer.hours || 0} horas</span>
          </div>
          <div class="salary-info">
            Pago: $${calculateSalary(officer.hours || 0, officer.rank, officer.department)}
          </div>
        </div>
        <div class="officer-actions">
          <button class="btn btn-success" onclick="openAddHoursModal('${officer.username}', ${officer.hours || 0})">➕ Agregar</button>
          <button class="btn btn-warning" onclick="openRemoveHoursModal('${officer.username}', ${officer.hours || 0})">➖ Remover</button>
          <button class="btn btn-info" onclick="resetHours('${officer.username}')">🔄 Reiniciar</button>
          <button class="btn btn-danger" onclick="fireOfficer('${officer.username}')">🚨 Despedir</button>
        </div>
      </div>
    `).join('');
  }

  function renderPagarTab() {
    const list = document.getElementById('pagar-list');
    list.innerHTML = allOfficers.map(officer => {
      const salary = calculateSalary(officer.hours || 0, officer.rank, officer.department);
      return `
        <div class="officer-card">
          <div class="officer-info">
            <div class="officer-name">${officer.character_name || officer.username}</div>
            <div class="officer-details">
              <span>🏢 ${officer.department}</span>
              <span>🎖️ ${officer.rank}</span>
              <span>⏰ ${officer.hours || 0} horas × 6 = ${(officer.hours || 0) * 6} horas juego</span>
            </div>
            <div class="salary-info" style="margin-top: 10px; background: rgba(74,204,143,0.1); border-color: rgba(74,204,143,0.3);">
              <strong style="color: #4acf8f;">💰 SALARIO TOTAL: $${salary.toLocaleString()}</strong><br>
              <small>(${officer.hours || 0}h × 6 × $${rankSystem[officer.department]?.find(r => r.rank === officer.rank)?.salary || 0}/h)</small>
            </div>
          </div>
          <div class="officer-actions">
            <button class="btn btn-success" onclick="payOfficer('${officer.username}', ${salary})">💸 PAGAR</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderRangoTab() {
    const list = document.getElementById('rango-list');
    list.innerHTML = allOfficers.map(officer => `
      <div class="officer-card">
        <div class="officer-info">
          <div class="officer-name">${officer.character_name || officer.username}</div>
          <div class="officer-details">
            <span>🏢 ${officer.department}</span>
            <span>🎖️ ${officer.rank}</span>
          </div>
        </div>
        <div class="officer-actions">
          <button class="btn btn-primary" onclick="openChangeRankModal('${officer.username}', '${officer.department}', '${officer.rank}')">Cambiar Rango</button>
        </div>
      </div>
    `).join('');
  }

  function renderDepartamentoTab() {
    const list = document.getElementById('departamento-list');
    list.innerHTML = allOfficers.map(officer => `
      <div class="officer-card">
        <div class="officer-info">
          <div class="officer-name">${officer.character_name || officer.username}</div>
          <div class="officer-details">
            <span>🏢 ${officer.department}</span>
          </div>
        </div>
        <div class="officer-actions">
          <button class="btn btn-primary" onclick="openChangeDeptModal('${officer.username}', '${officer.department}')">Cambiar Departamento</button>
        </div>
      </div>
    `).join('');
  }

  function openModal(title, content) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = content;
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  function confirmAction() {
    if (currentAction) currentAction();
  }

  function openAddHoursModal(username, currentHours) {
    openModal('Agregar Horas', `
      <input type="number" id="hours-input" placeholder="Cantidad de horas" min="1" value="1" style="width: 100%; margin-bottom: 15px;">
    `);
    currentAction = () => {
      const hours = parseInt(document.getElementById('hours-input').value) || 0;
      updateOfficerHours(username, currentHours + hours);
      closeModal();
    };
  }

  function openRemoveHoursModal(username, currentHours) {
    openModal('Remover Horas', `
      <input type="number" id="hours-input" placeholder="Cantidad de horas" min="1" max="${currentHours}" value="1" style="width: 100%; margin-bottom: 15px;">
    `);
    currentAction = () => {
      const hours = parseInt(document.getElementById('hours-input').value) || 0;
      updateOfficerHours(username, Math.max(0, currentHours - hours));
      closeModal();
    };
  }

  function resetHours(username) {
    if (confirm('¿Reiniciar horas de este oficial?')) {
      updateOfficerHours(username, 0);
    }
  }

  function fireOfficer(username) {
    if (confirm('¿Despeedir a este oficial? (Se quitarán todas las horas y el rango)')) {
      updateOfficerHours(username, 0);
      alert('✓ Oficial despedido');
      loadOfficers();
    }
  }

  function payOfficer(username, amount) {
    alert(`✓ Pago de $${amount.toLocaleString()} enviado a ${username}`);
    resetHours(username);
  }

  function openChangeRankModal(username, dept, currentRank) {
    const ranks = rankSystem[dept] || [];
    const options = ranks.map(r => `<option value="${r.rank}" ${r.rank === currentRank ? 'selected' : ''}>${r.rank} - $${r.salary}/h</option>`).join('');
    openModal('Cambiar Rango', `
      <select id="rank-select" style="width: 100%; margin-bottom: 15px;">
        ${options}
      </select>
    `);
    currentAction = () => {
      const newRank = document.getElementById('rank-select').value;
      updateOfficerRank(username, newRank);
      closeModal();
    };
  }

  function openChangeDeptModal(username, currentDept) {
    openModal('Cambiar Departamento', `
      <select id="dept-select" style="width: 100%; margin-bottom: 15px;">
        <option value="HPD" ${currentDept === 'HPD' ? 'selected' : ''}>HPD</option>
        <option value="HCSO" ${currentDept === 'HCSO' ? 'selected' : ''}>HCSO</option>
        <option value="HFD" ${currentDept === 'HFD' ? 'selected' : ''}>HFD</option>
        <option value="EMS" ${currentDept === 'EMS' ? 'selected' : ''}>EMS</option>
        <option value="DOT" ${currentDept === 'DOT' ? 'selected' : ''}>DOT</option>
        <option value="ICE" ${currentDept === 'ICE' ? 'selected' : ''}>ICE</option>
        <option value="THP" ${currentDept === 'THP' ? 'selected' : ''}>THP</option>
      </select>
    `);
    currentAction = () => {
      const newDept = document.getElementById('dept-select').value;
      updateOfficerDept(username, newDept);
      closeModal();
    };
  }

  function updateOfficerHours(username, newHours) {
    const officer = allOfficers.find(o => o.username === username);
    if (officer) {
      officer.hours = newHours;
      renderHorasTab();
      renderPagarTab();
      alert('✓ Horas actualizadas');
    }
  }

  function updateOfficerRank(username, newRank) {
    const officer = allOfficers.find(o => o.username === username);
    if (officer) {
      officer.rank = newRank;
      renderRangoTab();
      renderPagarTab();
      alert('✓ Rango actualizado');
    }
  }

  function updateOfficerDept(username, newDept) {
    const officer = allOfficers.find(o => o.username === username);
    if (officer) {
      officer.department = newDept;
      officer.rank = rankSystem[newDept][0].rank;
      renderDepartamentoTab();
      renderRangoTab();
      renderPagarTab();
      alert('✓ Departamento actualizado');
    }
  }

  function filterOfficers(tab) {
    const searchInput = document.getElementById(`search-${tab}`);
    const deptFilter = document.getElementById(`dept-filter-${tab}`);
    const search = searchInput ? searchInput.value.toLowerCase() : '';
    const dept = deptFilter ? deptFilter.value : '';
    
    const filtered = allOfficers.filter(o => {
      const matchSearch = (o.character_name || o.username).toLowerCase().includes(search);
      const matchDept = !dept || o.department === dept;
      return matchSearch && matchDept;
    });
    
    const list = document.getElementById(`${tab}-list`);
    if (tab === 'horas') {
      list.innerHTML = filtered.map(officer => `
        <div class="officer-card">
          <div class="officer-info">
            <div class="officer-name">${officer.character_name || officer.username}</div>
            <div class="officer-details">
              <span>🏢 ${officer.department}</span>
              <span>🎖️ ${officer.rank}</span>
              <span>⏰ ${officer.hours || 0} horas</span>
            </div>
          </div>
          <div class="officer-actions">
            <button class="btn btn-success" onclick="openAddHoursModal('${officer.username}', ${officer.hours || 0})">➕ Agregar</button>
            <button class="btn btn-warning" onclick="openRemoveHoursModal('${officer.username}', ${officer.hours || 0})">➖ Remover</button>
            <button class="btn btn-info" onclick="resetHours('${officer.username}')">🔄 Reiniciar</button>
            <button class="btn btn-danger" onclick="fireOfficer('${officer.username}')">🚨 Despedir</button>
          </div>
        </div>
      `).join('');
    }
  }

  function loadRanksForDept() {
    renderRangoTab();
  }

  window.addEventListener('load', loadOfficers);
</script>

</body>
</html>
