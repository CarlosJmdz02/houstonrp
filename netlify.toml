# Proxy API calls to Netlify Functions
[[redirects]]
  from = "/api/erlc/check/*"
  to = "/.netlify/functions/erlc-check/:splat"
  status = 200

# Catch-all 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404


